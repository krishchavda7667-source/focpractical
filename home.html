<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 380px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2563eb;
            font-size: 40px;
            font-weight: bold;
            border: 5px solid rgba(255,255,255,0.7);
        }

        .header h1 {
            margin-top: 15px;
            font-size: 25px;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .details {
            padding: 25px;
        }

        .item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item strong {
            color: #333;
        }

        .item span {
            float: right;
            color: #666;
        }

        .btn {
            display: block;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <div class="profile">K</div>

            <h1>Krish Chavda</h1>
            <p>Computer Science & Engineering</p>
        </div>

        <div class="details">

            <div class="item">
                <strong>Enrollment No.</strong>
                <span>T2602180330036</span>
            </div>

            <div class="item">
                <strong>Division</strong>
                <span>A</span>
            </div>

            <div class="item">
                <strong>Semester</strong>
                <span>6</span>
            </div>

            <div class="item">
                <strong>Subject</strong>
                <span>Web Development</span>
            </div>

            <a href="#" class="btn">View Profile</a>

        </div>

    </div>

</body>
</html>
